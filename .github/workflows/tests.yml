name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # timesfm[mlx] needs Apple silicon, so CI installs everything else and installs the package without dependencies.
      # Tests that need the model or the local twin skip themselves; they still run on the lab machine.
      - run: pip install numpy pandas duckdb fastapi uvicorn "psycopg[binary]" boto3 pytest httpx
      - run: pip install -e . --no-deps
      - run: python -m pytest -q -W ignore
