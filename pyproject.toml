[project]
name = "prophet"
version = "0.2.0"
description = "Prophet: a durable forecasting agent with TimesFM 3, NIM-hosted planning and sandboxed analytics. R&D use."
requires-python = ">=3.12"
dependencies = [
  "timesfm[mlx]==3.0.2",   # TimesFM 3 (optional MLX extra, pinned)
  "numpy",
  "pandas",
  "matplotlib",
  "openpyxl",
  "python-calamine==0.9.1",   # reads xls, xlsb and ods; MIT
  "scipy",
  "statsmodels",
  "scikit-learn",   # KNN and iterative imputation, robust scaling, isolation forest in the analysis sandbox
  "seaborn",        # statistical diagnostics charts in the analysis sandbox
  "holidays",   # public-holiday calendars for event covariates; MIT
  "python-docx",
  "reportlab",
  "pdfplumber",     # reads tables from PDFs for download_web_data (opendata/pdf_landing.py); MIT
  "jsonschema",
  "httpx",
  "ddgs",           # self-hosted web search (DuckDuckGo, Bing, Google, Yahoo backends) for the research tools; MIT
  "trafilatura",    # main-text extraction from fetched pages; Apache-2.0
  "beautifulsoup4", # fallback text extraction; MIT
  "ruptures",       # changepoint search in the analysis sandbox; BSD
  "duckdb",         # pl.query reads large files in place in the analysis sandbox; MIT
  "lxml",           # HTML parser for page tables (beautifulsoup4 "lxml"); BSD
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prophet_agent"]

[project.optional-dependencies]
dev = ["pytest", "pillow"]
datasets = ["pyarrow"]   # scripts/fetch_datasets.py writes Parquet
browser = ["playwright>=1.65"]   # research/render.py draws JavaScript pages; then run: python -m playwright install chromium

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # lets tests import prophet_agent without an install
markers = ["timesfm: runs the real TimesFM 3 model (cached weights, Apple silicon); deselect with -m 'not timesfm'"]
