[project]
name = "timesfm-erp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "timesfm[mlx]==3.0.2",
  "numpy",
  "pandas",
  "duckdb",
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
  "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # lets tests import prophet_agent without an install
